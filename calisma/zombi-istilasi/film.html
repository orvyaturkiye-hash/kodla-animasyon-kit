<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombi İstilası: Her Şey O Gün Başladı</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b10;color:#eee;font:14px Arial,sans-serif}body{display:grid;place-items:center;min-height:100vh}canvas{display:block;width:min(100vw,177.78vh);height:auto;max-height:100vh;background:#10141b}#yardim{position:fixed;bottom:8px;color:#aaa;font-size:12px;text-align:center}
</style></head>
<body><canvas id="film" aria-label="Zombi istilası animasyonu"></canvas><div id="yardim">Tıklayın: oynat/duraklat · Ok tuşları: kare kare ilerle</div>
<script>
'use strict';
const W=1280,H=720,FPS=24,DURATION=60,TAU=Math.PI*2,c=document.querySelector('#film'),g=c.getContext('2d',{alpha:false});c.width=W;c.height=H;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function rnd(n){let x=(n*1664525+1013904223)>>>0;x=Math.imul(x^(x>>>16),0x7feb352d);x=Math.imul(x^(x>>>15),0x846ca68b);return((x^(x>>>16))>>>0)/4294967296}
function label(s,x,y,size=25,color='#eee5d9',weight=500){g.save();g.font=`${weight} ${size}px Arial`;g.textAlign='center';g.textBaseline='middle';g.fillStyle=color;g.shadowColor='#080a0d';g.shadowBlur=10;g.fillText(s,x,y);g.restore()}
function fade(a,b,t){return ease((t-a)/(b-a))}
function subtitle(s,t,a,b){let o=fade(a,a+.25,t)*(1-fade(b-.3,b,t));if(!o)return;g.save();g.globalAlpha=o;g.fillStyle='rgba(4,7,10,.72)';g.beginPath();g.roundRect(175,625,930,54,10);g.fill();label(s,640,652,23);g.restore()}
function vignette(power=.62){let q=g.createRadialGradient(640,350,170,640,350,790);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,`rgba(0,0,0,${power})`);g.fillStyle=q;g.fillRect(0,0,W,H)}
function sky(t,dark=false){let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,dark?'#121923':'#302b41');q.addColorStop(.48,dark?'#3a343d':'#d37b57');q.addColorStop(1,dark?'#22252b':'#eb9a63');g.fillStyle=q;g.fillRect(0,0,W,H);if(!dark){let x=925-(t*8%260),r=g.createRadialGradient(x,300,8,x,300,240);r.addColorStop(0,'rgba(255,222,160,.8)');r.addColorStop(1,'rgba(255,170,105,0)');g.fillStyle=r;g.fillRect(x-240,60,480,480);g.fillStyle='#ffce91';g.beginPath();g.arc(x,300,46,0,TAU);g.fill()}}
function smoke(x,y,r,t,a=.2){for(let i=0;i<5;i++){let xx=x+Math.sin(t*.3+i)*r*.35,yy=y-i*r*.31,rr=r*(.45+i*.2),q=g.createRadialGradient(xx,yy,1,xx,yy,rr);q.addColorStop(0,`rgba(49,54,60,${a})`);q.addColorStop(1,'rgba(49,54,60,0)');g.fillStyle=q;g.beginPath();g.arc(xx,yy,rr,0,TAU);g.fill()}}
function city(t,chaos=0){sky(t);let hz=440;for(let i=0;i<23;i++){let x=i*63-(t*4%63),w=42+rnd(i+5)*35,h=92+rnd(i+21)*168,y=hz-h;g.fillStyle=['#353743','#41404a','#303440'][i%3];g.fillRect(x,y,w,h);for(let xx=x+8;xx<x+w-5;xx+=15)for(let yy=y+15;yy<hz-8;yy+=23){g.fillStyle=rnd(i*100+xx+yy)>.48?'rgba(255,203,139,.45)':'rgba(28,38,47,.65)';g.fillRect(xx,yy,5,8)}}g.fillStyle='#38383d';g.fillRect(0,hz,W,H-hz);g.fillStyle='#5b514a';g.fillRect(0,hz,W,68);for(let side of [-1,1])for(let i=0;i<4;i++){let x=side<0?-100+i*70:W-190+i*68,y=255+i*34,w=125,h=200-i*24;g.fillStyle=['#39363d','#4b4142','#343943'][i%3];g.fillRect(x,y,w,h);for(let xx=x+15;xx<x+w-12;xx+=27)for(let yy=y+25;yy<y+h-12;yy+=34){g.fillStyle=chaos>.2&&rnd(i+yy)<chaos*.5?'#252a31':'rgba(247,188,128,.38)';g.fillRect(xx,yy,11,16)}}g.strokeStyle='rgba(237,218,185,.35)';g.lineWidth=3;for(let i=0;i<7;i++){g.beginPath();g.moveTo(640+(i-3)*10,444);g.lineTo((i*220)-40,720);g.stroke()}if(chaos)for(let i=0;i<7;i++)smoke(95+i*185,155+rnd(i+4)*200,40+rnd(i+12)*50,t+i,.12+chaos*.12)}
function person(x,y,s,t,color='#333941',skin='#c68d70',phase=0){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,0,13,4,0,0,TAU);g.fill();let sw=Math.sin(t*7+phase)*5;g.strokeStyle=color;g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(-4,-24);g.lineTo(-8+sw,-6);g.moveTo(4,-24);g.lineTo(9-sw,-6);g.stroke();g.fillStyle=color;g.beginPath();g.roundRect(-9,-47,18,26,6);g.fill();g.strokeStyle=color;g.lineWidth=5;g.beginPath();g.moveTo(-8,-43);g.lineTo(-15+sw,-28);g.moveTo(8,-43);g.lineTo(15-sw,-28);g.stroke();g.fillStyle=skin;g.beginPath();g.arc(0,-55,8,0,TAU);g.fill();g.restore()}
function zombie(x,y,s,t,i=0){g.save();g.translate(x,y);g.scale(s,s);g.rotate(Math.sin(t*2+i)*.07);g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(0,0,16,5,0,0,TAU);g.fill();g.strokeStyle='#39433a';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(-5,-24);g.lineTo(-7,-6);g.moveTo(5,-24);g.lineTo(8,-6);g.stroke();g.fillStyle=i%2?'#48473d':'#39443d';g.fillRect(-11,-45,22,25);g.strokeStyle='#475146';g.lineWidth=5;g.beginPath();g.moveTo(-9,-42);g.lineTo(-23,-49+Math.sin(t*3+i)*3);g.moveTo(9,-42);g.lineTo(22,-49);g.stroke();g.fillStyle='#9ca989';g.beginPath();g.ellipse(0,-54,9,11,0,0,TAU);g.fill();g.fillStyle='#292821';g.beginPath();g.arc(-3,-56,2,0,TAU);g.arc(4,-56,2,0,TAU);g.fill();g.restore()}
function car(x,y,s,col='#354750',ang=0){g.save();g.translate(x,y);g.rotate(ang);g.scale(s,s);g.fillStyle=col;g.beginPath();g.roundRect(-42,-15,84,31,8);g.fill();g.fillStyle='#91a0a0';g.beginPath();g.moveTo(-25,-14);g.lineTo(-15,-29);g.lineTo(18,-29);g.lineTo(31,-14);g.closePath();g.fill();g.fillStyle='#263743';g.fillRect(-10,-26,24,10);g.fillStyle='#111';for(let xx of [-26,25]){g.beginPath();g.arc(xx,14,9,0,TAU);g.fill()}g.fillStyle='#e7d4a0';g.fillRect(-40,-8,5,8);g.fillStyle='#d54d44';g.fillRect(36,-8,5,8);g.restore()}
function siren(t){g.fillStyle=`rgba(190,35,48,${.04+.04*Math.sin(t*17)**2})`;g.fillRect(0,0,W,H)}
function header(a,b){g.fillStyle='rgba(5,8,12,.42)';g.fillRect(0,0,W,105);label(a,640,35,17,'#e4ad76',700);label(b,640,74,31,'#f3eee6',700)}
function s1(t){city(t);for(let i=0;i<9;i++)person((i*172+t*26)%1400-50,536+(i%3)*32,.78+(i%3)*.08,t,'#363d42','#ca9476',i);car((210+t*38)%1400,610,.85);car(1060-t*28,562,.67,'#704942');if(t>5)siren(t);header('ZOMBİ İSTİLASI · BÖLÜM 1','HER ŞEY O GÜN BAŞLADI');subtitle(t<5?'Her şey sıradan bir gün gibi başlamıştı...':'Ta ki o sirenler çalmaya başlayana kadar...',t,1,7.8)}
function s2(t){city(8);let q=t-8;for(let i=0;i<7;i++)person(110+i*180,575+(i%2)*26,.82,t,'#363d42','#ca9476',i);g.save();g.translate(640,555);g.rotate(fade(9,10.3,t)*1.3);person(0,0,1.15,t,'#514035','#b98168');g.restore();for(let i=0;i<3;i++)person(535+i*92,557,.78,t,'#45464a','#c58d71',i);if(t>14){zombie(640,555,1.2,t);for(let i=0;i<6;i++)person((i*190+t*85)%1400-60,570,.85,t,'#3a3b42','#c58d71',i)}if(t>13)siren(t);header('İLK VAKA','YARDIM ETMEK İÇİN YAKLAŞTILAR');subtitle(t<13?'Sokak ortasında bir adam yere yığıldı.':'Ama o adam artık insan değildi.',t,9,17.8)}
function s3(t){city(t,.8);siren(t);for(let i=0;i<9;i++){let x=(60+i*157+Math.sin(t*2+i)*16)%1300;zombie(x,570+(i%3)*30,.72+(i%3)*.1,t,i);if(i%2===0)person(x-40,550,.75,t,'#393d43','#c48b6e',i)}car(320+Math.sin(t)*40,620,1.1,'#39444b',t>24?.25:0);car(900-Math.sin(t*1.6)*70,566,.9,'#69423f',t>24?-.2:0);header('ŞEHİR DÜŞÜYOR','KAÇIŞ YOK');subtitle('Dakikalar içinde sokaklar kaosa sürüklendi.',t,20,29.8)}
function heli(x,y){g.save();g.translate(x,y);g.fillStyle='#333e44';g.beginPath();g.ellipse(0,0,43,16,0,0,TAU);g.fill();g.fillStyle='#171d23';g.beginPath();g.arc(30,-3,13,0,TAU);g.fill();g.strokeStyle='#222a30';g.lineWidth=3;g.beginPath();g.moveTo(-8,-13);g.lineTo(-27,-27);g.lineTo(-49,-24);g.moveTo(-17,-29);g.lineTo(15,-29);g.moveTo(35,0);g.lineTo(58,-5);g.stroke();g.restore()}
function s4(t){city(t,1);for(let i=0;i<8;i++)smoke(125+i*165,190+rnd(i)*95,70,.23,t+i);for(let i=0;i<18;i++)zombie((i*97+t*18)%1280,575+(i%4)*32,.56+(i%4)*.08,t,i);for(let i=0;i<8;i++)person((i*160+t*35)%1280,595+(i%3)*27,.74,t,'#31373b','#bd8a70',i);heli(160+(t-30)*70,155+Math.sin(t)*12);siren(t);header('ŞEHRİN SON GÜNÜ','YÜZLERCE ENFEKTE SOKAKLARDA');subtitle('Televizyonlarda tek bir uyarı vardı. Ama artık çok geçti.',t,31,42.8)}
function room(t){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#101722');sky.addColorStop(.6,'#4c3b42');sky.addColorStop(1,'#171a20');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#070c13';g.fillRect(48,65,490,420);g.fillStyle='#453a43';g.fillRect(58,75,470,400);for(let i=0;i<9;i++){let x=68+i*52,h=125+rnd(i+4)*190;g.fillStyle='#1a222b';g.fillRect(x,475-h,42,h);for(let j=0;j<4;j++){g.fillStyle=rnd(i*8+j)>.5?'rgba(246,180,112,.5)':'#111923';g.fillRect(x+7+j%2*18,490-h+Math.floor(j/2)*34,7,12)}}g.fillStyle='#111820';g.fillRect(48,65,12,420);g.fillRect(538,65,12,420);g.fillRect(48,65,502,12);g.fillRect(48,475,502,12);g.fillRect(290,76,9,399);
// door
 g.fillStyle='#342921';g.fillRect(850,95,340,545);g.fillStyle='#45372d';g.fillRect(870,115,300,500);g.strokeStyle='#735a45';g.lineWidth=5;g.strokeRect(891,139,256,450);g.fillStyle='#c2a16a';g.beginPath();g.arc(1135,390,8,0,TAU);g.fill();g.fillStyle='#22282b';g.fillRect(0,640,W,80);g.fillStyle='#504035';g.fillRect(0,630,W,12);
// main character: repeated design and outfit for visual continuity
hero(t);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,0,W,H)}
function hero(t){g.save();g.translate(630,605+Math.sin(t*1.7)*2);g.fillStyle='#202a31';g.beginPath();g.moveTo(-56,-160);g.lineTo(-5,-160);g.lineTo(-15,0);g.lineTo(-55,0);g.closePath();g.fill();g.beginPath();g.moveTo(4,-160);g.lineTo(54,-160);g.lineTo(58,0);g.lineTo(20,0);g.closePath();g.fill();g.fillStyle='#35464a';g.beginPath();g.moveTo(-70,-333);g.lineTo(60,-336);g.quadraticCurveTo(95,-320,98,-278);g.lineTo(82,-162);g.lineTo(-86,-162);g.lineTo(-108,-270);g.quadraticCurveTo(-100,-325,-70,-333);g.fill();g.fillStyle='#c7b9a2';g.beginPath();g.moveTo(-20,-330);g.lineTo(20,-330);g.lineTo(34,-180);g.lineTo(-34,-180);g.fill();g.fillStyle='#b98168';g.fillRect(-20,-370,40,43);g.beginPath();g.ellipse(0,-408,40,52,0,0,TAU);g.fill();g.fillStyle='#30251f';g.beginPath();g.moveTo(-40,-417);g.quadraticCurveTo(-42,-470,-7,-466);g.quadraticCurveTo(31,-472,40,-432);g.lineTo(34,-421);g.quadraticCurveTo(8,-435,-1,-444);g.quadraticCurveTo(-18,-421,-40,-417);g.fill();g.fillStyle='#eee6dc';g.fillRect(-21,-409,11,5);g.fillRect(12,-409,11,5);g.fillStyle='#25221f';g.fillRect(-16,-409,4,5);g.fillRect(17,-409,4,5);g.strokeStyle='#593833';g.lineWidth=3;g.beginPath();g.ellipse(0,-382,7,5,0,0,TAU);g.stroke();g.strokeStyle='#66736c';g.lineWidth=4;g.beginPath();g.moveTo(-42,-326);g.lineTo(-18,-285);g.lineTo(-3,-318);g.moveTo(42,-326);g.lineTo(18,-285);g.lineTo(3,-318);g.stroke();g.restore()}
function phone(){g.save();g.translate(180,390);g.rotate(-.08);g.fillStyle='#10151b';g.beginPath();g.roundRect(-58,-100,116,200,15);g.fill();g.fillStyle='#e3e8e4';g.beginPath();g.roundRect(-44,-54,88,108,5);g.fill();g.fillStyle='#bd3935';g.beginPath();g.arc(0,-34,14,0,TAU);g.fill();label('!',0,-34,18,'#fff',700);g.fillStyle='#292a2d';g.font='bold 8px Arial';g.textAlign='center';g.fillText('ACİL DURUM!',0,-10);g.fillText('DIŞARI ÇIKMAYIN!',0,9);g.fillText('ENFEKTE OLANLARDAN',0,25);g.fillText('UZAK DURUN!',0,41);g.restore()}
function s5(t){room(t);let q=t-43;if(q<3){g.fillStyle=`rgba(0,0,0,${.42*(1-q/3)})`;g.fillRect(0,0,W,H)}if(q>3)phone();header('O GECE','EVİMDE YALNIZDIM');subtitle(q<5?'Şehir düşmüştü.':q<10?'Bir uyarı ekranı aydınlattı.':'Ama artık çok geçti...',t,44,54.8)}
function s6(t){room(t);let q=t-55;g.fillStyle=`rgba(0,0,0,${.34+fade(55,57,t)*.25})`;g.fillRect(0,0,W,H);let sc=1+fade(57.5,60,t)*.55;g.save();g.translate(650,370);g.scale(sc,sc);g.translate(-650,-370);g.fillStyle='#25343b';g.beginPath();g.roundRect(552,260,196,280,60);g.fill();g.fillStyle='#c08b71';g.beginPath();g.ellipse(650,240,75,92,0,0,TAU);g.fill();g.fillStyle='#30241f';g.beginPath();g.moveTo(575,238);g.quadraticCurveTo(565,140,641,145);g.quadraticCurveTo(728,146,725,236);g.lineTo(702,209);g.quadraticCurveTo(664,220,631,202);g.quadraticCurveTo(605,235,575,238);g.fill();g.fillStyle='#f0e7dc';g.beginPath();g.ellipse(620,248,14,9,0,0,TAU);g.ellipse(679,248,14,9,0,0,TAU);g.fill();g.fillStyle='#26211e';g.beginPath();g.arc(625,249,5,0,TAU);g.arc(674,249,5,0,TAU);g.fill();g.strokeStyle='#56342f';g.lineWidth=4;g.beginPath();g.ellipse(650,294,16,11,0,0,TAU);g.stroke();g.restore();if(q>.3){g.strokeStyle='rgba(195,177,153,.55)';g.lineWidth=4;for(let i=0;i<3;i++){g.beginPath();g.moveTo(950+i*36,280);g.lineTo(926+i*36,385);g.stroke()}}let rot=fade(58.1,59.7,t)*.8;g.save();g.translate(1135,390);g.rotate(rot);g.fillStyle='#c2a16a';g.beginPath();g.roundRect(-3,-7,48,12,5);g.fill();g.restore();if(q>2.8)label('“Yardım et... Lütfen...”',640,625,21,'#ddd4c7');subtitle(q<2.8?'Kapımın arkasından bir tırmalama sesi geldi.':'Ama o ses... insan sesi değildi.',t,55.3,59.7);g.fillStyle=`rgba(0,0,0,${fade(59.45,60,t)})`;g.fillRect(0,0,W,H)}
function renderFrame(n){let t=clamp(n,0,FPS*DURATION-1)/FPS;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);if(t<8)s1(t);else if(t<18)s2(t);else if(t<30)s3(t);else if(t<43)s4(t);else if(t<55)s5(t);else s6(t);vignette(t>54?.8:.58)}
window.READY=Promise.resolve({width:W,height:H,fps:FPS,frames:FPS*DURATION});window.renderFrame=renderFrame;renderFrame(0);
if(!new URLSearchParams(location.search).has('capture')){let frame=0,playing=false,origin=0;function toggle(){playing=!playing;origin=performance.now()-frame*1000/FPS}addEventListener('click',toggle);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();playing=false;frame=clamp(frame+(e.code==='ArrowRight'?1:-1),0,FPS*DURATION-1);renderFrame(frame)}});function tick(now){if(playing){frame=Math.floor((now-origin)*FPS/1000);if(frame>=FPS*DURATION){frame=FPS*DURATION-1;playing=false}}renderFrame(frame);requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></body></html>
